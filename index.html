<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FLIKY AI PRO ✨ | Умный ассистент</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0c12;
            --bg-panel: rgba(18, 22, 35, 0.92);
            --accent: #a855f7;
            --accent-glow: #c084fc;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-dim: rgba(255, 255, 255, 0.07);
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            width: 100vw;
        }

        /* Сайдбар */
        .sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 290px;
            height: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(28px);
            z-index: 2000;
            transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-right: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
        }

        .sidebar.active {
            left: 0;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1500;
        }

        .overlay.active {
            display: block;
        }

        /* Основной контейнер чата */
        .chat-container {
            flex: 1;
            padding: 20px 18px 100px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* Стили сообщений */
        .msg {
            padding: 14px 18px;
            border-radius: 26px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.45;
            animation: fadeSlideUp 0.2s ease-out;
            word-wrap: break-word;
            transition: all 0.1s;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.25);
        }

        .ai {
            background: rgba(30, 35, 48, 0.8);
            backdrop-filter: blur(4px);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-dim);
        }

        .global-msg {
            background: rgba(59, 130, 246, 0.18) !important;
            border-left: 3px solid #3b82f6;
        }

        /* изображения внутри сообщений */
        .msg img {
            max-width: 100%;
            border-radius: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        /* инпут зона */
        .input-area {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 750px;
            background: rgba(22, 27, 41, 0.96);
            backdrop-filter: blur(24px);
            border-radius: 44px;
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }

        .input-area:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            height: 52px;
            font-size: 16px;
            padding: 0 8px;
            font-family: inherit;
        }

        input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            padding: 10px;
            font-size: 24px;
            transition: 0.15s;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent-glow);
        }

        /* превью изображения */
        .preview-card {
            position: absolute;
            bottom: 88px;
            left: 20px;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--accent);
            backdrop-filter: blur(12px);
            z-index: 20;
        }

        .preview-card img {
            height: 54px;
            width: 54px;
            object-fit: cover;
            border-radius: 16px;
        }

        /* экран логина */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, #0f0f1a, #020308);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .google-btn {
            background: white;
            color: black;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            width: 280px;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }

        .google-btn:active {
            transform: scale(0.96);
        }

        /* список чатов */
        .chat-item {
            padding: 14px 16px;
            margin: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: rgba(168, 85, 247, 0.2);
        }

        /* индикатор прослушивания */
        .mic-active {
            color: #ef4444 !important;
            text-shadow: 0 0 6px red;
        }

        /* прокрутка */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }

        button {
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="text-align:center;">
            <h1 style="font-size: 48px; background: linear-gradient(135deg, #c084fc, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent;">FLIKY AI PRO</h1>
            <p style="margin: 16px 0 24px; color:#a0aec0;">Голос + Фотоанализ | Умный ассистент</p>
        </div>
        <button class="google-btn" onclick="loginWithGoogle()">🚀 Войти через Google</button>
        <button class="google-btn" onclick="loginAsGuest()" style="background:transparent; color:white; border:1px solid #a855f7;">👤 Режим гостя</button>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div style="padding: 28px 20px; display:flex; justify-content:space-between; align-items:center;">
            <b style="font-size: 22px; background: linear-gradient(95deg, #fff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent;">✨ FLIKY</b>
            <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size: 26px; cursor:pointer;">✕</button>
        </div>
        <button onclick="switchToGlobal()" style="margin: 0 16px 12px 16px; padding: 14px; background: linear-gradient(95deg, #2563eb, #7c3aed); border:none; border-radius: 40px; color:white; font-weight: bold; cursor:pointer;">🌍 World Chat (глобал)</button>
        <button onclick="createNewChat()" style="margin: 0 16px 20px 16px; padding: 14px; background: var(--accent); border:none; border-radius: 40px; color:white; font-weight: bold; cursor:pointer;">+ Новый приватный чат</button>
        <div id="chatList" style="flex:1; overflow-y:auto; margin-top: 4px;"></div>
        <div style="padding: 16px; border-top: 1px solid var(--border-dim); font-size: 13px; color:#6c7293;">
            <div>🤖 Автор: Даулет</div>
            <button onclick="logout()" style="margin-top: 12px; background: none; color:#f87171; border:1px solid #f87171; padding: 8px 16px; border-radius: 40px; width:100%; cursor:pointer;">Выйти</button>
        </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; position:relative; width:100%;">
        <div style="height: 70px; border-bottom: 1px solid var(--border-dim); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: rgba(10,12,18,0.7); backdrop-filter: blur(12px);">
            <div style="display:flex; align-items: center; gap: 12px;">
                <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size: 28px; cursor:pointer;">☰</button>
                <span id="headerTitle" style="font-weight: 700; font-size: 18px;">🤖 FLIKY AI</span>
            </div>
            <div id="proBadge" style="background: linear-gradient(145deg, #fbbf24, #f59e0b); color: #0f0f0f; padding: 5px 14px; border-radius: 40px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">⚡ PRO VISION</div>
        </div>

        <div id="chat" class="chat-container"></div>

        <!-- превью картинки -->
        <div id="preview-wrap" class="preview-card" style="display: none;">
            <img id="preview-img" src="" alt="preview">
            <span style="font-size:13px;">Фото готово</span>
            <button onclick="clearImage()" style="background: #ef4444; border:none; border-radius: 30px; padding: 6px 12px; color:white; font-weight:bold; cursor:pointer;">✕</button>
        </div>

        <div class="input-area">
            <label style="cursor:pointer; padding: 6px;">📎<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)"></label>
            <button class="btn-icon" id="micBtn" onclick="startVoiceInput()">🎤</button>
            <input type="text" id="userInput" placeholder="Спроси меня о чём угодно... или отправь фото для анализа" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-icon" onclick="sendMessage()" style="color:var(--accent);">➤</button>
        </div>
    </div>

    <script>
        // ---------- FIREBASE ----------
        const firebaseConfig = {
            apiKey: "AIzaSyClnvxC1lgvrxn-m7X1huqNmvtH7HaYsxU",
            authDomain: "flikyfloky-61eed.firebaseapp.com",
            projectId: "flikyfloky-61eed",
            storageBucket: "flikyfloky-61eed.firebasestorage.app",
            messagingSenderId: "167396726913",
            appId: "1:167396726913:web:871fb5bc1cf4eca509d580"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const GROQ_KEY = "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";

        let currentUser = null;
        let chats = [];
        let activeChatId = null;
        let pendingImageBase64 = null;
        let isGlobalMode = false;

        // -------- Аутентификация ---------
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        function loginAsGuest() {
            currentUser = { uid: 'guest_' + Date.now(), displayName: 'Гость', isGuest: true };
            startApp();
        }

        auth.getRedirectResult().then(result => {
            if (result.user) {
                currentUser = result.user;
                startApp();
            }
        });
        auth.onAuthStateChanged(user => {
            if (user && !currentUser) {
                currentUser = user;
                startApp();
            }
        });

        function startApp() {
            document.getElementById('login-screen').style.display = 'none';
            loadChatsFromLocal();
            renderChatSidebar();
            // если нет активного чата, создаём дефолтный
            if (!activeChatId && chats.length === 0) createNewChat();
            else if (activeChatId && !isGlobalMode) renderMessagesByChatId();
        }

        // -------- Локальное хранилище чатов ----------
        function loadChatsFromLocal() {
            const raw = localStorage.getItem(`flikychats_${currentUser.uid}`);
            if (raw) {
                chats = JSON.parse(raw);
            } else {
                chats = [];
            }
        }
        function persistChats() {
            localStorage.setItem(`flikychats_${currentUser.uid}`, JSON.stringify(chats));
        }
        function saveChatsAndSync() {
            persistChats();
            renderChatSidebar();
        }

        function renderChatSidebar() {
            const container = document.getElementById('chatList');
            if (!container) return;
            container.innerHTML = '';
            chats.slice(0, 20).forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerText = c.title || `Чат ${new Date(c.id).toLocaleTimeString()}`;
                div.onclick = () => {
                    isGlobalMode = false;
                    activeChatId = c.id;
                    document.getElementById('headerTitle').innerText = `💬 ${c.title || 'Диалог'}`;
                    renderMessagesByChatId();
                    toggleMenu();
                };
                container.appendChild(div);
            });
        }

        function createNewChat() {
            isGlobalMode = false;
            const newId = Date.now();
            const newChat = {
                id: newId,
                title: `Чат ${chats.length + 1}`,
                messages: [],
                createdAt: newId
            };
            chats.unshift(newChat);
            activeChatId = newId;
            persistChats();
            renderChatSidebar();
            renderMessagesByChatId();
            document.getElementById('headerTitle').innerText = `💬 ${newChat.title}`;
            toggleMenu();
        }

        function renderMessagesByChatId() {
            const container = document.getElementById('chat');
            if (!container) return;
            const chat = chats.find(c => c.id === activeChatId);
            if (!chat || isGlobalMode) return;
            container.innerHTML = '';
            if (chat.messages.length === 0) {
                const welcomeDiv = document.createElement('div');
                welcomeDiv.className = 'msg ai';
                welcomeDiv.innerHTML = marked.parse("✨ Привет! Я **FLIKY AI** — твой умный ассистент. Могу **анализировать фото** (отправь картинку) и отвечать голосом. Задавай вопросы!");
                container.appendChild(welcomeDiv);
            } else {
                chat.messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${msg.role === 'user' ? 'user' : 'ai'}`;
                    let contentHtml = '';
                    if (msg.image) contentHtml += `<img src="${msg.image}" alt="uploaded">`;
                    if (msg.content) contentHtml += marked.parse(msg.content);
                    msgDiv.innerHTML = contentHtml;
                    container.appendChild(msgDiv);
                });
            }
            container.scrollTop = container.scrollHeight;
        }

        // Глобальный чат реального времени
        let globalUnsub = null;
        function switchToGlobal() {
            isGlobalMode = true;
            activeChatId = 'global';
            document.getElementById('headerTitle').innerText = "🌍 World Chat (Глобал)";
            const container = document.getElementById('chat');
            container.innerHTML = '<div class="msg ai">🌐 Загрузка мирового чата...</div>';
            if (globalUnsub) globalUnsub();
            globalUnsub = db.collection("global_chat").orderBy("time", "asc").limitToLast(60).onSnapshot(snap => {
                if (!isGlobalMode) return;
                container.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    const isMine = data.uid === currentUser?.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMine ? 'user' : 'ai global-msg'}`;
                    div.innerHTML = `<small style="color:#a78bfa; font-weight:500;">${data.user || 'Аноним'}</small><br>${marked.parse(data.text)}`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
            toggleMenu();
        }

        // ---------- ОТПРАВКА сообщений с анализом фото ----------
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text && !pendingImageBase64) return;

            if (isGlobalMode) {
                if (!text) return;
                await db.collection("global_chat").add({
                    text: text,
                    user: currentUser.displayName || currentUser.email || "Гость",
                    uid: currentUser.uid,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });
                inputField.value = '';
                return;
        }

            // Приватный ИИ-чат
            if (!activeChatId || activeChatId === 'global') {
                createNewChat();
            }
            const chat = chats.find(c => c.id === activeChatId);
            if (!chat) return;

            const userText = text || "Опиши это изображение";
            const imageToSend = pendingImageBase64;

            // сохраняем сообщение пользователя
            const userMsgObj = { role: 'user', content: userText, image: imageToSend || null };
            chat.messages.push(userMsgObj);
            persistChats();
            renderMessagesByChatId();
            inputField.value = '';
            clearImage();

            // добавляем временное сообщение ассистента
            const assistantPlaceholder = { role: 'assistant', content: '🤔 Думаю...' };
            chat.messages.push(assistantPlaceholder);
            persistChats();
            renderMessagesByChatId();

            const lastMsgIndex = chat.messages.length - 1;
            const msgContainer = document.getElementById('chat');
            const lastMsgDiv = msgContainer.lastChild;

            try {
                let model = "llama-3.3-70b-versatile";
                let apiMessages = [{ role: "system", content: "Ты — FLIKY AI, супер интеллектуальный ассистент. Отвечай кратко, ясно, дружелюбно. Если есть фото, проанализируй детально." }];

                if (imageToSend) {
                    model = "llama-3.2-11b-vision-preview";
                    apiMessages.push({
                        role: "user",
                        content: [
                            { type: "text", text: userText },
                            { type: "image_url", image_url: { url: imageToSend } }
                        ]
                    });
                } else {
                    const recent = chat.messages.slice(-6).filter(m => m.role !== 'assistant' || m.content !== '🤔 Думаю...');
                    for (let m of recent) {
                        if (m.role === 'user') apiMessages.push({ role: 'user', content: m.content });
                        else if (m.role === 'assistant' && m.content !== '🤔 Думаю...') apiMessages.push({ role: 'assistant', content: m.content });
                    }
                    if (apiMessages.length === 1) apiMessages.push({ role: "user", content: userText });
                }

                const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_KEY}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: apiMessages,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await resp.json();
                let fullAnswer = data.choices?.[0]?.message?.content || "⚠️ Ошибка генерации, попробуй ещё раз.";
                if (imageToSend && !fullAnswer) fullAnswer = "📸 Изображение получено! Я вижу его, но не могу точно описать. Попробуй задать конкретный вопрос по фото.";

                // анимация печати
                assistantPlaceholder.content = "";
                let i = 0;
                const interval = setInterval(() => {
                    if (i < fullAnswer.length) {
                        assistantPlaceholder.content += fullAnswer[i];
                        i++;
                        if (lastMsgDiv) lastMsgDiv.innerHTML = marked.parse(assistantPlaceholder.content);
                        msgContainer.scrollTop = msgContainer.scrollHeight;
                    } else {
                        clearInterval(interval);
                        persistChats();
                        renderMessagesByChatId();
                    }
                }, 12);
            } catch (err) {
                console.error(err);
                assistantPlaceholder.content = "❌ Ошибка сети или сервера. Проверь соединение или формат фото (jpeg/png).";
                persistChats();
                renderMessagesByChatId();
            }
        }

        // ---------- ГОЛОСОВОЙ ВВОД (распознавание) ----------
        let recognition = null;
        function startVoiceInput() {
            const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecog) {
                alert("Ваш браузер не поддерживает голосовой ввод. Используйте Chrome / Edge / Safari.");
                return;
            }
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            recognition = new SpeechRecog();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = false;

            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('mic-active');
            recognition.onstart = () => {
                micBtn.style.color = "#ef4444";
            };
            recognition.onend = () => {
                micBtn.classList.remove('mic-active');
                micBtn.style.color = "#cbd5e1";
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                micBtn.style.color = "#cbd5e1";
                recognition = null;
            };
            recognition.onerror = (e) => {
                console.warn(e);
                micBtn.style.color = "#cbd5e1";
                alert("Ошибка микрофона, проверь разрешения.");
                recognition = null;
            };
            recognition.start();
        }

        // ---------- РАБОТА С ИЗОБРАЖЕНИЯМИ ----------
        function handleImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            if (!file.type.startsWith('image/')) {
                alert("Пожалуйста, выбери изображение (JPEG, PNG)");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                pendingImageBase64 = e.target.result;
                const previewWrap = document.getElementById('preview-wrap');
                const previewImg = document.getElementById('preview-img');
                previewImg.src = pendingImageBase64;
                previewWrap.style.display = 'flex';
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        function clearImage() {
            pendingImageBase64 = null;
            document.getElementById('preview-wrap').style.display = 'none';
        }

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlayDiv = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlayDiv.classList.toggle('active');
        }

        function logout() {
            if (globalUnsub) globalUnsub();
            auth.signOut().then(() => {
                localStorage.clear();
                location.reload();
            }).catch(() => location.reload());
        }

        // дополнительные инициализации
        window.sendMessage = sendMessage;
        window.startVoiceInput = startVoiceInput;
        window.handleImage = handleImage;
        window.clearImage = clearImage;
        window.toggleMenu = toggleMenu;
        window.switchToGlobal = switchToGlobal;
        window.createNewChat = createNewChat;
        window.loginWithGoogle = loginWithGoogle;
        window.loginAsGuest = loginAsGuest;
        window.logout = logout;
    </script>
</body>
</html>
